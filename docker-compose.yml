services:
  postgres:
    image: postgres:16-alpine
    container_name: jungle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: jungle_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jungle_financial

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.7.0
    container_name: jungle-localstack
    restart: unless-stopped

    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1

    ports:
      - "4566:4566"

volumes:
  postgres_data:
